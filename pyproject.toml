[project]
name = "tg_vinland_bot"
version = "0.0.1"
description = "@vinland_downloader_bot telegram bot for downloading media"
authors = [
    {name = "Vellih0r, shaadowww, Senku-qq"}
]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "aiogram (>=3.28.2,<4.0.0)",
    "yt-dlp (>=2026.3.17,<2027.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "yt-dlp-ejs (>=0.8.0,<0.9.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
