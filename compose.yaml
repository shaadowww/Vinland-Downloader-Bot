services: 
  app: 
    build: . 
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped
  db: 
    image: postgres:16
    environment:
    -  POSTGRES_USER=${DB_USERNAME}
    -  POSTGRES_DB=${DB_NAME}
    -  POSTGRES_PASSWORD=${DB_PASS}
    volumes: 
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped 

volumes:
  postgres_data: